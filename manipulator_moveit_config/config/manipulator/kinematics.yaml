# Configures how a robot calculates possible positions and movements of its joints
# to reach a desired point. It specifies which mathematical methods (solvers) to use,
# how long to try, and how precise these calculations should be.
ur_manipulator: # Name of the joint group from the SRDF file
  #kinematics_solver: trac_ik_kinematics_plugin/TRAC_IKKinematicsPlugin
  ## Optional TRAC-IK parameters:
  #solve_type: Speed          # Speed | Distance | Manipulation1 | Manipulation2 | Manipulation3
  #epsilon: 1e-5              # Convergence tolerance (small positive number)

  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
  position_only_ik: false # true = ignore orientation (debugging / special tasks)
  kinematics_solver_attempts: 5
